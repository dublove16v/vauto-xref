<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="./streamlit-component-lib.js"></script>
  </head>
  <body>
    <script>
      function onRender(event) {
        const args = (event.detail && event.detail.args) || {};
        const key = args.storeKey || "vauto-xref-browser-v1";
        if (typeof args.payload === "string" && args.payload) {
          try {
            localStorage.setItem(key, args.payload);
          } catch (error) {
            // The previous copy stays if this browser is out of room.
          }
        }
        let stored = "";
        try {
          stored = localStorage.getItem(key) || "";
        } catch (error) {
          stored = "";
        }
        Streamlit.setComponentValue(stored);
        Streamlit.setFrameHeight(0);
      }
      Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
      Streamlit.setComponentReady();
      Streamlit.setFrameHeight(0);
    </script>
  </body>
</html>
